# Cogrid CLI
[project]
name = "cogrid-cli"
version = "0.1.0"
description = "Cogrid 命令行客户端"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
cogrid = "cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]
