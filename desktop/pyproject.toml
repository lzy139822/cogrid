# Cogrid Desktop — 桌面版打包配置
[project]
name = "cogrid-desktop"
version = "0.1.0"
description = "Cogrid 桌面版 — 一体化 Windows exe"
requires-python = ">=3.11"
dependencies = [
    # 打包工具
    "pyinstaller>=6.0",
    # 系统托盘
    "pystray>=0.19",
    "pillow>=10.0",
    # 协调器依赖（重复列出确保打包完整）
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    # Agent 依赖
    "psutil>=5.9",
    "docker>=7.0",
    "typer>=0.12",
    "rich>=13.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
