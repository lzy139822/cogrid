# Cogrid 本地开发环境
# 一键拉起：make dev 或 docker-compose up --build
#
# 当前为骨架阶段，服务定义待实现后补充实际构建逻辑。

version: "3.9"

services:
  # 协调器
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    ports:
      - "8000:8000"   # REST API
      - "50051:50051" # gRPC
    environment:
      - COGRID_DB_PATH=/data/cogrid.db
      - COGRID_LOG_LEVEL=debug
    volumes:
      - coordinator-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 模拟贡献者节点 1
  agent-1:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - COGRID_COORDINATOR=coordinator:50051
      - COGRID_NODE_NAME=agent-1
      - COGRID_INTENSITY=balanced
    depends_on:
      coordinator:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # 模拟贡献者节点 2
  agent-2:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - COGRID_COORDINATOR=coordinator:50051
      - COGRID_NODE_NAME=agent-2
      - COGRID_INTENSITY=conservative
    depends_on:
      coordinator:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # 模拟贡献者节点 3
  agent-3:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      - COGRID_COORDINATOR=coordinator:50051
      - COGRID_NODE_NAME=agent-3
      - COGRID_INTENSITY=aggressive
    depends_on:
      coordinator:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Web 仪表盘
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      coordinator:
        condition: service_healthy

volumes:
  coordinator-data:
